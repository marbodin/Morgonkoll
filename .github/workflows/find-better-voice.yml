name: Find a better free voice

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 1 */3 *"

permissions:
  contents: read

jobs:
  reevaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      MORGONKOLL_CACHE_DIR: ${{ github.workspace }}/.cache/morgonkoll
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ffmpeg and benchmark dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --disable-pip-version-check ".[benchmark,asr]"
          ram_gb="$(awk '/MemTotal/ {printf "%.1f", $2/1024/1024}' /proc/meminfo)"
          echo "RUNNER_RAM_GB=$ram_gb" >> "$GITHUB_ENV"
          if awk "BEGIN {exit !($ram_gb >= 6.0)}"; then
            python -m pip install --disable-pip-version-check ".[chatterbox]"
            python -m pip install --disable-pip-version-check --force-reinstall "setuptools<81"
          fi
          python -m pip check

      - name: Restore candidate models
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/morgonkoll
          key: reevaluate-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/voice_candidates.yml', 'pyproject.toml') }}
          restore-keys: |
            reevaluate-${{ runner.os }}-${{ runner.arch }}-

      - name: Audit maintained primary-source metadata
        continue-on-error: true
        run: python -m src.registry_audit

      - name: Re-benchmark without changing production
        run: |
          python -m src.voice_benchmark \
            --mode audition \
            --no-select \
            --with-asr \
            --runner-ram-gb "$RUNNER_RAM_GB"

      - name: Upload recommendation, source audit and samples
        uses: actions/upload-artifact@v4
        with:
          name: morgonkoll-voice-reevaluation
          path: voice_samples/
          if-no-files-found: error
          retention-days: 30
