name: Generate Morgonkoll

on:
  schedule:
    - cron: "15 5 * * *"
      timezone: "Europe/Stockholm"
  workflow_dispatch:
    inputs:
      use_live_news:
        description: Build a current sourced news script before narration
        required: false
        default: true
        type: boolean
      send_to_telegram:
        description: Send the finished episode to the configured Telegram chat
        required: false
        default: true
        type: boolean
      script_path:
        description: Source script when live news is disabled
        required: false
        default: content/script.txt
      episode_date:
        description: Episode date (YYYY-MM-DD); blank means today
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: morgonkoll-daily
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      MORGONKOLL_CACHE_DIR: ${{ github.workspace }}/.cache/morgonkoll
      MORGONKOLL_FEED_CACHE_DIR: ${{ github.workspace }}/.cache/news-feeds
      SCRIPT_PATH: ${{ inputs.script_path }}
      REQUESTED_DATE: ${{ inputs.episode_date }}
      TTS_ENGINE: ${{ vars.TTS_ENGINE }}
      TTS_MODEL: ${{ vars.TTS_MODEL }}
      TTS_VOICE: ${{ vars.TTS_VOICE }}
      USE_LIVE_NEWS: ${{ inputs.use_live_news }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Restore pinned local models
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
          key: models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/selected_voice.json', 'config/voice_candidates.yml', 'config/news_model.json', 'pyproject.toml') }}
          restore-keys: |
            models-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore rolling news cache
        if: github.event_name == 'schedule' || inputs.use_live_news == true
        uses: actions/cache@v4
        with:
          path: |
            .cache/news-feeds
            .cache/morgonkoll/news_sections
          key: news-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            news-${{ runner.os }}-

      - name: Install production engines
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check ".[production]"
          selected_engine="$(python -c 'import json; print(json.load(open("config/selected_voice.json"))["engine"])')"
          if [[ "$selected_engine" == "chatterbox" || "${TTS_ENGINE:-}" == "chatterbox" ]]; then
            python -m pip install --disable-pip-version-check ".[chatterbox]"
            python -m pip install --disable-pip-version-check --force-reinstall "setuptools<81"
          fi
          if [[ "$selected_engine" == "mms" || "${TTS_ENGINE:-}" == "mms" ]]; then
            python -m pip install --disable-pip-version-check ".[mms]"
          fi
          python -m pip check

      - name: Resolve inputs
        id: inputs
        shell: bash
        run: |
          episode_date="${REQUESTED_DATE:-$(date -u +%F)}"
          echo "episode_date=$episode_date" >> "$GITHUB_OUTPUT"

      - name: Install current-news pipeline
        if: github.event_name == 'schedule' || inputs.use_live_news == true
        run: |
          CMAKE_ARGS="-DGGML_NATIVE=OFF -DGGML_OPENMP=ON" \
            python -m pip install --disable-pip-version-check ".[news,news-llm]"

      - name: Create sourced current-news script
        id: news
        shell: bash
        run: |
          use_live="${USE_LIVE_NEWS:-true}"
          if [[ "$use_live" == "false" ]]; then
            script="${SCRIPT_PATH:-content/script.txt}"
            test -s "$script" || { echo "::error::Missing or empty source script: $script"; exit 1; }
          else
            python -m src.news_pipeline --date "${{ steps.inputs.outputs.episode_date }}"
            script="build/news/${{ steps.inputs.outputs.episode_date }}/script.txt"
          fi
          echo "script=$script" >> "$GITHUB_OUTPUT"

      - name: Lightweight free-voice health check
        run: python -m src.health_check

      - name: Generate normalized MP3
        shell: bash
        run: |
          cover_args=()
          if [[ -f assets/cover.jpg ]]; then
            cover_args=(--cover assets/cover.jpg)
          fi
          python -m src.pipeline \
            --script "${{ steps.news.outputs.script }}" \
            --date "${{ steps.inputs.outputs.episode_date }}" \
            "${cover_args[@]}"

      - name: Verify MP3 for Telegram audio transport
        run: python -m src.verify_audio "output/morgonkoll-${{ steps.inputs.outputs.episode_date }}.mp3"

      - name: Send episode to phone with Telegram
        if: github.event_name == 'schedule' || inputs.send_to_telegram == true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          caption="God morgon! Här kommer Morgonkoll för ${{ steps.inputs.outputs.episode_date }}."
          manifest="build/news/${{ steps.inputs.outputs.episode_date }}/manifest.json"
          if [[ -f "$manifest" ]] && python -c \
            'import json,sys; sys.exit(json.load(open(sys.argv[1])).get("fallback_reason") is None)' \
            "$manifest"; then
            caption="God morgon! Manusmodellen använde säker kortreserv för dagens Morgonkoll."
          fi
          python -m src.telegram_delivery \
            "output/morgonkoll-${{ steps.inputs.outputs.episode_date }}.mp3" \
            --caption "$caption"

      - name: Upload episode
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morgonkoll-${{ steps.inputs.outputs.episode_date }}
          path: |
            output/morgonkoll-${{ steps.inputs.outputs.episode_date }}.mp3
            build/news/${{ steps.inputs.outputs.episode_date }}/script.txt
            build/news/${{ steps.inputs.outputs.episode_date }}/sources.json
            build/news/${{ steps.inputs.outputs.episode_date }}/sources.md
            build/news/${{ steps.inputs.outputs.episode_date }}/manifest.json
          if-no-files-found: error
          retention-days: 14
